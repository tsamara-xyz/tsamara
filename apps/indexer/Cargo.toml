[package]
name = "tsamara-indexer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Carbon 2.0.0 needs rustc 1.96.1; 1.0.0 is the newest release that builds on the pinned toolchain.
carbon-core = { version = "1.0.0", default-features = false }
carbon-rpc-transaction-crawler-datasource = "1.0.0"
# Same major versions as Carbon 1.0.0, so the types line up.
solana-client = "3"
solana-commitment-config = "3"
solana-instruction = { version = "3", default-features = false }
solana-pubkey = { version = "3", features = ["curve25519"] }
solana-signature = "3"
solana-transaction-status = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = { version = "0.11", default-features = false }
